name: sigma
description: "HackIllinois 2026 Submission by Ian Wilkey and Barney Jin for Modal track."
publish_to: 'none'

version: 2026.2.28+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.12.0
  mediapipe_face_mesh: ^1.2.4
  go_router: ^17.1.0
  http: ^1.6.0
  image: ^4.8.0
  flutter_native_splash: ^2.4.7
  pdf: ^3.11.2
  path_provider: ^2.1.5
  share_plus: ^10.0.0
  flutter_dotenv: ^5.1.0

dependency_overrides:
  image: ^4.8.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  ios: true
  image_path: "assets/icon.png"

flutter_native_splash:
  color: "#000000"
  image: assets/icon.png
  ios_content_mode: center
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/Inter-Regular.ttf
    - assets/Inter-Bold.ttf
    - .env
